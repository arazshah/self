{% extends "base.html" %}
{% block title %}تنظیمات{% endblock %}
{% block content %}<section class="card"><p class="eyebrow">تنظیمات شخصی</p><h1>زمان‌بندی گزارش‌ها</h1><form action="/settings" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>منطقهٔ زمانی<input name="timezone" value="{{ user.timezone }}" required></label><label>ساعت ارسال گزارش صبحگاهی<input type="number" name="daily_digest_hour" min="0" max="23" value="{{ user.daily_digest_hour }}" required></label><div class="actions"><button class="button" type="submit">ذخیره</button><a class="button secondary" href="/dashboard">بازگشت</a></div></form></section>{% endblock %}
