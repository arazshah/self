{% extends "base.html" %}
{% block title %}ویرایش ثبت{% endblock %}
{% block content %}
<section class="card"><p class="eyebrow">ویرایش و دسته‌بندی دوباره</p><h1>متن ثبت را اصلاح کن</h1><form action="/entries/{{ entry.id }}/edit" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><textarea name="text" rows="10" required>{{ entry.transcript or entry.raw_text or "" }}</textarea><div class="actions"><button class="button" type="submit">ذخیره و تحلیل دوباره</button><a class="button secondary" href="/dashboard">انصراف</a></div></form></section>
{% endblock %}
