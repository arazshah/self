<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}صندوقچه{% endblock %}</title><link rel="stylesheet" href="/static/style.css">
  <style>
    .nav-group{margin:0}.nav-group summary{list-style:none;cursor:pointer}.nav-group summary::-webkit-details-marker{display:none}.nav-group summary i{margin-right:auto;font-style:normal;font-size:.75rem}.sub-nav{display:grid;gap:3px;margin:3px 8px 7px 0;border-right:1px solid #477064;padding-right:9px}.sub-item{color:#9ebcb0;text-decoration:none;font-size:.73rem;padding:6px 8px;border-radius:8px}.sub-item:hover,.sub-item.selected{background:#285247;color:#fff}.top-actions{display:flex;align-items:center;gap:14px}.top-actions a{color:#9ebcb0;text-decoration:none;font-size:.8rem}.quick-links{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.quick-links a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid #e4ebe4;border-radius:13px;background:#fff;text-decoration:none}.quick-links span{color:#176b58;font-size:1.1rem}.quick-links b{font-size:.8rem}.quick-links small{color:#71807a;font-size:.65rem}.panel-footer-link{display:block;margin-top:13px;padding:10px 12px;border-radius:9px;background:#f3f7f2;color:#176b58;text-decoration:none;font-size:.7rem}.mini-timeline{display:grid;gap:2px}.mini-timeline>div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #edf1ed}.mini-timeline>div:last-child{border:0}.mini-timeline span{font-size:1rem}.mini-timeline p{margin:0;min-width:0}.mini-timeline b,.mini-timeline small{display:block}.mini-timeline b{font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-timeline small{color:#71807a;font-size:.63rem}.standalone-panel{min-height:420px}.count-badge{background:#dff1e8;color:#176b58;border-radius:20px;padding:4px 9px;font-size:.68rem}.reminder-list{list-style:none;padding:0;margin:0}.reminder-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #edf1ed}.reminder-row:last-child{border:0}.reminder-icon{font-size:1.1rem}.reminder-row>div:nth-child(2){flex:1}.reminder-row b,.reminder-row small{display:block}.reminder-row b{font-size:.8rem}.reminder-row small{color:#71807a;font-size:.68rem}.reminder-row.done{opacity:.62}.reminder-row.done b{text-decoration:line-through}.workspace-note{display:flex;align-items:center;gap:12px;margin-top:18px;padding:15px 17px;border:1px dashed #bdd9ca;border-radius:13px;background:#edf7f0;color:#176b58}.workspace-note>span{font-size:1.25rem}.workspace-note b,.workspace-note p{display:block}.workspace-note b{font-size:.78rem}.workspace-note p{margin:2px 0 0;color:#71807a;font-size:.7rem}@media(max-width:620px){.nav-group{position:relative}.nav-group .sub-nav{display:none;position:absolute;bottom:58px;right:-75px;width:180px;background:#18312b;border:1px solid #315248;border-radius:12px;padding:8px;margin:0;box-shadow:0 -10px 25px #102c2040}.nav-group[open] .sub-nav{display:grid}.nav-group summary i{display:none}.quick-links{grid-template-columns:repeat(2,1fr);gap:7px}.quick-links a{padding:11px}.quick-links b{font-size:.7rem}.quick-links small{font-size:.58rem}.standalone-panel{min-height:360px}.workspace-note{align-items:flex-start}}
  </style>
  <style>.report-stack{display:grid;gap:16px}.report-card{padding:24px}.report-card pre{white-space:pre-wrap;font:inherit;font-size:.8rem;line-height:2;color:#52615a;margin:0}.current-report{border-color:#c8e8d9;background:#fbfdfb}@media(max-width:620px){.report-card{padding:16px}.report-card pre{font-size:.7rem}}</style>
  <style>.time-warning{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:7px;background:#fff4df;color:#8d6022;font-size:.68rem}.due-label{margin-top:6px;color:#176b58;font-size:.68rem}</style>
</head>
<body>
  <div class="app-shell">
    {% if user %}
    <aside class="sidebar">
      <a class="brand" href="/dashboard"><span class="brand-mark">ص</span><span><b>صندوقچه</b><small>دستیار شخصی تو</small></span></a>
      <nav class="side-nav" aria-label="منوی اصلی">
        <a class="nav-item {% if active_path|default('/dashboard') == '/dashboard' %}active{% endif %}" href="/dashboard">⌂ <span>نمای کلی</span></a>
        <a class="nav-item {% if active_path|default('') == '/today' %}active{% endif %}" href="/today">◷ <span>امروز</span></a>
        <a class="nav-item {% if active_path|default('') == '/week' %}active{% endif %}" href="/week">▦ <span>این هفته</span></a>
        <a class="nav-item {% if active_path|default('') == '/reminders' %}active{% endif %}" href="/reminders">⏰ <span>یادآوری‌های باز</span></a>
        <a class="nav-item" href="/reports/daily">◌ <span>گزارش‌ها</span></a>
        <details class="nav-group" id="category-menu" {% if category is defined and category %}open{% endif %}><summary class="nav-item">◈ <span>دسته‌بندی‌ها</span><i>⌄</i></summary><div class="sub-nav">{% for key, label in labels.items() %}<a class="sub-item {% if category is defined and category == key %}selected{% endif %}" href="/categories/{{ key }}">{{ icons.get(key, '•') }} {{ label }}</a>{% endfor %}</div></details>
      </nav>
      <div class="sidebar-bottom"><a class="nav-item" href="/settings">⚙ <span>تنظیمات</span></a><form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="nav-item nav-button">↪ <span>خروج</span></button></form></div>
    </aside>
    {% endif %}
    <main class="content"><header class="mobile-header"><a class="brand" href="/dashboard"><span class="brand-mark">ص</span><b>صندوقچه</b></a>{% if user %}<a href="/settings" class="icon-link">⚙</a>{% endif %}</header>{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
