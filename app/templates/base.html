<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}صندوقچه{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/dashboard">صندوقچه</a>
      {% if user %}
      <nav class="top-actions"><a href="/settings">⚙️ تنظیمات</a><form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link-button">خروج</button></form></nav>
      {% endif %}
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
